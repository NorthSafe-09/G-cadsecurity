label: "GCAD-Live"
grub2:
  default: 0
  timeout: 10
  entries:
    - name: "Essayer ou installer G-CAD Security"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=GCAD-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Essayer ou installer G-CAD Security (mode graphique de base)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=GCAD-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
